user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name love6202.soaengry.com love6202.api.soaengry.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name love6202.soaengry.com;

        ssl_certificate /etc/letsencrypt/live/love6202.soaengry.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/love6202.soaengry.com-0001/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|webp|svg|ico|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    server {
        listen 443 ssl;
        server_name love6202.api.soaengry.com;

        ssl_certificate /etc/letsencrypt/live/love6202.soaengry.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/love6202.soaengry.com-0001/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
