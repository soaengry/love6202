user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name love6202.soaengry.com love6202.api.soaengry.com love6202.cloud api.love6202.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 메인 프론트엔드
    server {
        listen 443 ssl;
        server_name love6202.cloud;

        ssl_certificate /etc/letsencrypt/live/love6202.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/love6202.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|webp|svg|ico|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 메인 API
    server {
        listen 443 ssl;
        server_name api.love6202.cloud;

        ssl_certificate /etc/letsencrypt/live/love6202.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/love6202.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 구 도메인 → 신 도메인 리다이렉트
    server {
        listen 443 ssl;
        server_name love6202.soaengry.com;

        ssl_certificate /etc/letsencrypt/live/love6202.soaengry.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/love6202.soaengry.com-0001/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 301 https://love6202.cloud$request_uri;
    }

    server {
        listen 443 ssl;
        server_name love6202.api.soaengry.com;

        ssl_certificate /etc/letsencrypt/live/love6202.soaengry.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/love6202.soaengry.com-0001/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 301 https://api.love6202.cloud$request_uri;
    }
}
