<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>LOVE6202</title>
    <meta
      name="description"
      content="LOVE6202 — 디지털 웨딩 초대장 서비스. 나만의 청첩장을 만들고 하객을 초대하세요."
    />
    <meta name="application-name" content="LOVE6202" />
    <script>
      (function () {
        var d = document.documentElement;
        var stored = localStorage.getItem("theme");
        if (
          stored === "dark" ||
          (!stored && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          d.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <footer
      id="app-static-footer"
      style="
        padding: 1.5rem 1rem 5rem;
        text-align: center;
        border-top: 1px solid #e5e7eb;
      "
    >
      <p
        style="
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.15em;
          color: #9ca3af;
          margin: 0 0 4px;
        "
      >
        LOVE6202
      </p>
      <p style="font-size: 11px; color: #9ca3af; margin: 0 0 12px">
        디지털 웨딩 초대장 서비스
      </p>
      <div style="display: flex; justify-content: center; gap: 16px">
        <a
          href="/privacy"
          style="font-size: 11px; color: #9ca3af; text-decoration: underline"
          >개인정보처리방침</a
        >
        <a
          href="/terms"
          style="font-size: 11px; color: #9ca3af; text-decoration: underline"
          >이용약관</a
        >
      </div>
    </footer>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
