services:
  backend:
    image: ${DOCKERHUB_USERNAME}/love6202-backend:${IMAGE_TAG:-dev-latest}
    container_name: love6202-backend-dev
    restart: unless-stopped
    env_file: /home/ubuntu/app/.env.dev
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - "8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - love6202-net
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:17-alpine
    container_name: love6202-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-love6202_dev}
    volumes:
      - /home/ubuntu/app/data/postgres-dev:/var/lib/postgresql/data
      - /home/ubuntu/app/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-love6202_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - love6202-net

  redis:
    image: redis:7-alpine
    container_name: love6202-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - /home/ubuntu/app/data/redis-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - love6202-net

networks:
  love6202-net:
    name: love6202-net-dev
    driver: bridge
