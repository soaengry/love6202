services:
  postgres:
    image: postgres:17-alpine
    container_name: love6202-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-love6202_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-love6202_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - love6202-net-local

  redis:
    image: redis:7-alpine
    container_name: love6202-redis-local
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-local-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - love6202-net-local

volumes:
  postgres-local-data:
  redis-local-data:

networks:
  love6202-net-local:
    name: love6202-net-local
    driver: bridge
