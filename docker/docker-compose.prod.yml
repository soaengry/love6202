services:
  postgres:
    image: postgres:17-alpine
    container_name: love6202-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /home/ubuntu/app/data/postgres:/var/lib/postgresql/data
      - /home/ubuntu/app/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - love6202-net

  redis:
    image: redis:7-alpine
    container_name: love6202-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - /home/ubuntu/app/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - love6202-net

  backend-blue:
    image: ${DOCKERHUB_USERNAME}/love6202-backend:${IMAGE_TAG:-prod-latest}
    container_name: love6202-backend-blue
    restart: unless-stopped
    env_file: /home/ubuntu/app/.env.prod
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - love6202-net
    deploy:
      resources:
        limits:
          memory: 256M

  backend-green:
    image: ${DOCKERHUB_USERNAME}/love6202-backend:${IMAGE_TAG:-prod-latest}
    container_name: love6202-backend-green
    restart: unless-stopped
    env_file: /home/ubuntu/app/.env.prod
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - love6202-net
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: love6202-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/app/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - backend-blue
    networks:
      - love6202-net
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  love6202-net:
    name: love6202-net
    driver: bridge
