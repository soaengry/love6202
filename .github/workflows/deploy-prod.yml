name: Deploy Production (Blue/Green)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/love6202-backend-prod

jobs:
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://love6202.api.soaengry.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: https://love6202.soaengry.com/oauth2/callback
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
          VITE_S3_BASE_URL: ${{ secrets.VITE_S3_BASE_URL }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  deploy:
    name: Blue/Green Deploy to EC2
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for scripts and nginx config)
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "scripts/,docker/,nginx/,frontend/dist/"
          target: /home/ubuntu/app-deploy-tmp/

      - name: Run blue/green deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Sync latest scripts, docker configs, and nginx config
            cp -r /home/ubuntu/app-deploy-tmp/scripts/* /home/ubuntu/app/scripts/
            cp -r /home/ubuntu/app-deploy-tmp/docker/*  /home/ubuntu/app/docker/
            cp -r /home/ubuntu/app-deploy-tmp/nginx/*   /home/ubuntu/app/nginx/
            chmod +x /home/ubuntu/app/scripts/*.sh

            # Sync frontend dist (atomic swap)
            rm -rf /home/ubuntu/app/frontend/dist
            cp -r /home/ubuntu/app-deploy-tmp/frontend/dist /home/ubuntu/app/frontend/dist

            # Log in to DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Run blue/green deploy
            IMAGE_TAG="${{ needs.build-backend.outputs.image_tag }}" \
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
              /home/ubuntu/app/scripts/deploy-prod.sh

            # Cleanup tmp
            rm -rf /home/ubuntu/app-deploy-tmp
