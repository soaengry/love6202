name: Deploy Dev

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/love6202-backend-dev

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dev EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4

      - name: Copy deploy scripts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "scripts/,docker/"
          target: /home/ubuntu/app-deploy-tmp/

      - name: Run dev deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Sync latest scripts and docker configs
            cp -r /home/ubuntu/app-deploy-tmp/scripts/* /home/ubuntu/app/scripts/
            cp -r /home/ubuntu/app-deploy-tmp/docker/*  /home/ubuntu/app/docker/
            chmod +x /home/ubuntu/app/scripts/*.sh

            # Log in to DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Run simple rolling deploy
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}" \
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
              /home/ubuntu/app/scripts/deploy-dev.sh

            # Cleanup tmp
            rm -rf /home/ubuntu/app-deploy-tmp
